name: Beta Candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact commit to package; must equal the selected workflow ref
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: product-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Lock candidate source
    runs-on: macos-26
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      candidate_tag: ${{ steps.metadata.outputs.candidate_tag }}
    steps:
      - name: Check out exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify isolated version-only candidate
        id: metadata
        env:
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "$GITHUB_SHA"
          test "$actual_commit" = "$EXPECTED_COMMIT"

          git fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          read -r commit parent extra <<<"$(git rev-list --parents -n 1 "$actual_commit")"
          test "$commit" = "$actual_commit"
          if [[ -z "${parent:-}" || -n "${extra:-}" ]]; then
            echo "Candidate must be one non-merge version commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$parent" "origin/$DEFAULT_BRANCH"; then
            echo "Candidate parent is not present on origin/$DEFAULT_BRANCH." >&2
            exit 1
          fi

          changed_files="$(git diff-tree --no-commit-id --name-only -r "$actual_commit")"
          if [[ "$changed_files" != "Support/Info.plist" ]]; then
            echo "Candidate may only change Support/Info.plist; found:" >&2
            printf '%s\n' "$changed_files" >&2
            exit 1
          fi

          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)"
          if [[ ! "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]]; then
            echo "Invalid candidate version: $version" >&2
            exit 1
          fi

          python3 - "$parent" "$version" <<'PY'
          import pathlib
          import plistlib
          import subprocess
          import sys

          parent, expected_version = sys.argv[1:]
          previous = plistlib.loads(
              subprocess.check_output(["git", "show", f"{parent}:Support/Info.plist"])
          )
          current = plistlib.loads(pathlib.Path("Support/Info.plist").read_bytes())
          changed_keys = sorted(
              key for key in previous.keys() | current.keys()
              if previous.get(key) != current.get(key)
          )
          if changed_keys != ["CFBundleShortVersionString"]:
              raise SystemExit(
                  "Support/Info.plist may only change CFBundleShortVersionString; "
                  f"changed keys: {changed_keys}"
              )
          if current["CFBundleShortVersionString"] != expected_version:
              raise SystemExit("Validated version does not match the plist value")
          PY

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=v$version-beta.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  package:
    name: Sign and notarize beta
    needs: preflight
    uses: oh-my-infra/apple-ci/.github/workflows/macos-developer-id.yml@e8836340e4623133a5ab128c246e81a4b7a4d708
    with:
      runner: macos-26
      lane: beta
      publish: true
    secrets:
      APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
      APPLE_ASC_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_ASC_PRIVATE_KEY_BASE64 }}
      APPLE_MATCH_PASSWORD: ${{ secrets.APPLE_MATCH_PASSWORD }}
      APPLE_MATCH_GIT_PRIVATE_KEY: ${{ secrets.APPLE_MATCH_GIT_PRIVATE_KEY }}

  publish-feed:
    name: Publish beta update feed
    needs: [preflight, package]
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      SPARKLE_VERSION: 2.10.0
      VERSION: ${{ needs.preflight.outputs.version }}
      CANDIDATE_TAG: ${{ needs.preflight.outputs.candidate_tag }}
    steps:
      - name: Download immutable candidate and Sparkle tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archives" "$RUNNER_TEMP/sparkle"
          gh release download "$CANDIDATE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "miniTools-$VERSION.zip" \
            --pattern "miniTools-$VERSION.zip.sha256" \
            --dir "$RUNNER_TEMP/archives"
          gh release download "$SPARKLE_VERSION" \
            --repo sparkle-project/Sparkle \
            --pattern "Sparkle-$SPARKLE_VERSION.tar.xz" \
            --dir "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle/Sparkle-$SPARKLE_VERSION.tar.xz" \
            -C "$RUNNER_TEMP/sparkle"

      - name: Verify and generate signed beta appcast
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/archives"
          shasum -a 256 -c "miniTools-$VERSION.zip.sha256"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | \
            "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$CANDIDATE_TAG/" \
              --maximum-versions 1 \
              "$RUNNER_TEMP/archives"
          mv appcast.xml appcast-beta.xml
          test -s appcast-beta.xml
          grep -q 'sparkle:edSignature=' appcast-beta.xml
          grep -q "miniTools-$VERSION.zip" appcast-beta.xml

      - name: Complete immutable candidate
        run: |
          candidate_notes="$RUNNER_TEMP/candidate-notes.md"
          gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json body --jq .body > "$candidate_notes"
          printf '\nZIP SHA-256: %s\n' "$(cut -d ' ' -f 1 "$RUNNER_TEMP/archives/miniTools-$VERSION.zip.sha256")" >> "$candidate_notes"
          gh release upload "$CANDIDATE_TAG" \
            "$RUNNER_TEMP/archives/appcast-beta.xml" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$CANDIDATE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --latest=false --notes-file "$candidate_notes"

      - name: Move rolling beta feed
        run: |
          set -euo pipefail
          if gh release view beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete beta --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create beta \
            "$RUNNER_TEMP/archives/appcast-beta.xml" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "miniTools Beta Update Feed" \
            --notes "Current immutable candidate: $CANDIDATE_TAG"

