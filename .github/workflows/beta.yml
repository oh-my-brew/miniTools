name: Fast Beta and Automatic Release
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit at an open development PR head
        required: true
        type: string
  pull_request_target:
    types: [labeled, synchronize, ready_for_review]
permissions:
  contents: read
jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft &&
       !startsWith(github.event.pull_request.head.ref, 'release/auto-') &&
       contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: product-publication
      cancel-in-progress: false
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
      version: ${{ steps.prepare.outputs.version }}
      metadata: ${{ steps.prepare.outputs.metadata }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: oh-my-infra/brew-ci
          ref: ddeb36362b5336f33ca94788884d78d1847ce7c2
          path: .release-automation
          persist-credentials: false
      - name: Reserve latest candidate and isolated version PR
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: miniTools
        run: python3 .release-automation/scripts/fast_release.py prepare

  test:
    needs: prepare
    name: Build and test
    runs-on: macos-26
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - name: Candidate tests in parallel with packaging
        id: tests
        run: |
          git diff --check
          plutil -lint Support/Info.plist
          bash -n Scripts/*.sh
          python3 -m unittest discover -s Tests/ReleaseWorkflow
          swift test
      - name: Report exact candidate result for branch protection
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          state=failure
          if [[ "$OUTCOME" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE" \
            -f "state=$state" -f "context=Build and test" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  security:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, ruby]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: fast-candidate-${{ matrix.language }}

  package:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_JSON: ${{ needs.prepare.outputs.metadata }}
      VERSION: ${{ needs.prepare.outputs.version }}
      CANDIDATE_COMMIT: ${{ needs.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: oh-my-infra/brew-ci
          ref: ddeb36362b5336f33ca94788884d78d1847ce7c2
          path: .release-automation
          persist-credentials: false
      - name: Reuse immutable Beta after a retry
        id: existing
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json,os;print(json.loads(os.environ["RELEASE_JSON"])["beta_tag"])')
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p dist
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist
            echo "reused=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Swift dependencies and compatible build outputs
        if: steps.existing.outputs.reused != 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .build
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ needs.prepare.outputs.candidate }}
          restore-keys: |
            release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        if: steps.existing.outputs.reused != 'true'
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Configure readonly Match access
        if: steps.existing.outputs.reused != 'true'
        env:
          MATCH_KEY: ${{ secrets.APPLE_MATCH_GIT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/apple-ci-ssh"
          printf '%s\n' "$MATCH_KEY" > "$RUNNER_TEMP/apple-ci-ssh/apple-signing"
          chmod 600 "$RUNNER_TEMP/apple-ci-ssh/apple-signing"
          ssh-keyscan -t ed25519 github.com > "$RUNNER_TEMP/apple-ci-ssh/known_hosts"
          echo "MATCH_GIT_PRIVATE_KEY=$RUNNER_TEMP/apple-ci-ssh/apple-signing" >> "$GITHUB_ENV"
          echo "GIT_SSH_COMMAND=ssh -i $RUNNER_TEMP/apple-ci-ssh/apple-signing -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/apple-ci-ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Build, sign and notarize immediately; quality tests are separate
        if: steps.existing.outputs.reused != 'true'
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_ASC_PRIVATE_KEY_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.APPLE_MATCH_PASSWORD }}
          APPLE_CI_PUBLISH: 'false'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: bundle exec fastlane fast_beta
      - name: Generate signed Beta and stable update feeds from the same ZIP
        if: steps.existing.outputs.reused != 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sparkle"
          gh release download 2.10.0 --repo sparkle-project/Sparkle --pattern Sparkle-2.10.0.tar.xz --dir "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle/Sparkle-2.10.0.tar.xz" -C "$RUNNER_TEMP/sparkle"
          beta_tag=$(python3 -c 'import json,os;print(json.loads(os.environ["RELEASE_JSON"])["beta_tag"])')
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/" --maximum-versions 1 dist
          mv dist/appcast.xml "$RUNNER_TEMP/stable-appcast.xml"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$beta_tag/" --maximum-versions 1 dist
          mv dist/appcast.xml dist/appcast-beta.xml
          cp "$RUNNER_TEMP/stable-appcast.xml" dist/appcast.xml
          grep -q 'sparkle:edSignature=' dist/appcast.xml
          grep -q 'sparkle:edSignature=' dist/appcast-beta.xml
      - name: Remove transient Apple credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/apple-ci-ssh"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Record immutable artifact identity
        if: steps.existing.outputs.reused != 'true'
        run: python3 .release-automation/scripts/fast_release.py manifest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-${{ github.run_id }}
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/release-manifest.json
            dist/appcast*.xml
          if-no-files-found: error

  beta:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: product-publication
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_JSON: ${{ needs.prepare.outputs.metadata }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: oh-my-infra/brew-ci
          ref: ddeb36362b5336f33ca94788884d78d1847ce7c2
          path: .release-automation
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-${{ github.run_id }}
          path: dist
      - name: Publish installable Beta without waiting for quality jobs
        run: python3 .release-automation/scripts/fast_release.py beta

  promote:
    needs: [prepare, test, security, beta]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: product-publication
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_JSON: ${{ needs.prepare.outputs.metadata }}
      RELEASE_DIRECTORY: promoted
    steps:
      - name: Check out trusted default branch and pinned signing identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: oh-my-infra/brew-ci
          ref: ddeb36362b5336f33ca94788884d78d1847ce7c2
          path: .release-automation
          persist-credentials: false
      - name: Protected merge and same-artifact automatic promotion
        run: python3 .release-automation/scripts/fast_release.py promote
