name: Promote Beta Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Immutable approved beta tag (vYYYY.MM.DD.N-beta.RUN)
        required: true
        type: string
      expected_sha256:
        description: Approved ZIP SHA-256
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: product-release
  cancel-in-progress: false

jobs:
  promote:
    name: Verify and promote exact beta archive
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      SPARKLE_VERSION: 2.10.0
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out approved candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_tag }}
          fetch-depth: 0

      - name: Validate candidate and signed stable tag
        id: metadata
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_TAG" =~ ^v([0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*)-beta\.[1-9][0-9]*$ ]]; then
            echo "Invalid candidate tag: $CANDIDATE_TAG" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "expected_sha256 must contain exactly 64 hexadecimal characters" >&2
            exit 1
          fi

          stable_tag="v$version"
          candidate_commit="$(git rev-parse "$CANDIDATE_TAG^{commit}")"
          # A protected approval is tied to this exact archive, never to "latest beta".
          approval_prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$candidate_commit/pulls")"
          if ! jq -e --arg tag "$CANDIDATE_TAG" --arg sha "$EXPECTED_SHA256" \
            --arg commit "$candidate_commit" '
              any(.[]; .head.sha == $commit
                and (.state == "open" or .merged_at != null)
                and any(.labels[]; .name == "release-approved")
                and ((.body // "") | contains($tag) and contains($sha) and contains($commit)))
            ' <<<"$approval_prs" >/dev/null; then
            echo "Missing protected approval for this exact candidate and ZIP SHA." >&2
            exit 1
          fi
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)"
          test "$plist_version" = "$version"

          git fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$candidate_commit" "origin/$DEFAULT_BRANCH"; then
            echo "Candidate commit has not entered origin/$DEFAULT_BRANCH." >&2
            exit 1
          fi

          is_prerelease="$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          test "$is_prerelease" = true
          if gh release view "$stable_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Stable release $stable_tag already exists; refusing to replace it." >&2
            exit 1
          fi

          git fetch origin "refs/tags/$stable_tag:refs/tags/$stable_tag"
          tag_object="$(git rev-parse "refs/tags/$stable_tag")"
          test "$(git cat-file -t "$tag_object")" = tag
          tag_payload="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
          test "$(jq -r .verification.verified <<<"$tag_payload")" = true
          test "$(jq -r .verification.reason <<<"$tag_payload")" = valid
          test "$(jq -r .object.type <<<"$tag_payload")" = commit
          test "$(jq -r .object.sha <<<"$tag_payload")" = "$candidate_commit"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable_tag=$stable_tag" >> "$GITHUB_OUTPUT"

      - name: Download the approved archive and Sparkle tools
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archives" "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/sparkle"
          gh release download "$CANDIDATE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "miniTools-$VERSION.zip" \
            --pattern "miniTools-$VERSION.zip.sha256" \
            --dir "$RUNNER_TEMP/archives"
          gh release download "$SPARKLE_VERSION" \
            --repo sparkle-project/Sparkle \
            --pattern "Sparkle-$SPARKLE_VERSION.tar.xz" \
            --dir "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle/Sparkle-$SPARKLE_VERSION.tar.xz" \
            -C "$RUNNER_TEMP/sparkle"

      - name: Verify exact archive, signature, and notarization
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/archives/miniTools-$VERSION.zip"
          checksum="$RUNNER_TEMP/archives/miniTools-$VERSION.zip.sha256"
          actual_sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          declared_sha="$(awk '{print $1}' "$checksum")"
          actual_sha="$(printf '%s' "$actual_sha" | tr '[:upper:]' '[:lower:]')"
          declared_sha="$(printf '%s' "$declared_sha" | tr '[:upper:]' '[:lower:]')"
          expected_sha="$(printf '%s' "$EXPECTED_SHA256" | tr '[:upper:]' '[:lower:]')"
          test "$actual_sha" = "$declared_sha"
          test "$actual_sha" = "$expected_sha"

          ditto -x -k "$archive" "$RUNNER_TEMP/unpacked"
          app="$RUNNER_TEMP/unpacked/miniTools.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$app/Contents/MacOS/MiniToolsPowerHelper"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          test "$(lipo -archs "$app/Contents/MacOS/MiniTools")" = arm64
          test "$(lipo -archs "$app/Contents/MacOS/MiniToolsPowerHelper")" = arm64

      - name: Generate stable signed appcast from the same ZIP
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          STABLE_TAG: ${{ steps.metadata.outputs.stable_tag }}
        run: |
          set -euo pipefail
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | \
            "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$STABLE_TAG/" \
              --maximum-versions 1 \
              "$RUNNER_TEMP/archives"
          test -s "$RUNNER_TEMP/archives/appcast.xml"
          grep -q 'sparkle:edSignature=' "$RUNNER_TEMP/archives/appcast.xml"
          grep -q "miniTools-$VERSION.zip" "$RUNNER_TEMP/archives/appcast.xml"

      - name: Publish immutable stable release
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          STABLE_TAG: ${{ steps.metadata.outputs.stable_tag }}
        run: |
          gh release create "$STABLE_TAG" \
            "$RUNNER_TEMP/archives/miniTools-$VERSION.zip" \
            "$RUNNER_TEMP/archives/miniTools-$VERSION.zip.sha256" \
            "$RUNNER_TEMP/archives/appcast.xml" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --latest \
            --title "miniTools $VERSION" \
            --generate-notes

